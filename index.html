<html lang="da"><head><meta name="golfchat-closed-at" content="2026-10-26T22:21:04.686Z"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Golfchat opdateres</title><style>*{box-sizing:border-box}:root{font-family:system-ui,-apple-system,sans-serif;color:#172e2a;background:#f1f6f3}body{min-height:100dvh;display:grid;place-items:center;margin:0;padding:24px}main{width:min(860px,100%);display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:center;background:#fff;border:1px solid #e2e9e5;border-radius:24px;padding:40px;box-shadow:0 12px 40px #143f350a}.george{width:100%;height:330px;object-fit:cover;object-position:center}small{font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#526962}h1{font-size:clamp(28px,6vw,38px);line-height:1.15;margin:18px 0}p{line-height:1.6}#maintenance-timing{padding:4px 18px;background:#f1f6f3;border-radius:12px}a{color:#143f35}.button{display:inline-block;padding:12px 22px;color:#fff;background:#143f35;border-radius:12px;text-decoration:none;font-weight:600}a:focus-visible{outline:3px solid #1a7464;outline-offset:4px}@media(max-width:620px){body{padding:16px}main{grid-template-columns:minmax(0,1fr);gap:8px;padding:24px}.george{height:220px;object-fit:contain}h1{margin-top:14px}}
</style><script>function showMaintenanceTiming(){
// Keep the original closure time; never restart the estimate on refresh.
const value=new URLSearchParams(location.search).get('closedAt')||document.querySelector('meta[name="golfchat-closed-at"]')?.content;
const closed=new Date(value);
if(value&&Number.isFinite(closed.getTime())){
 const time=date=>date.toLocaleTimeString('da-DK',{timeZone:'Europe/Copenhagen',hour:'2-digit',minute:'2-digit'});
 const box=document.getElementById('maintenance-timing');
 const update=()=>{if(!box)return;box.replaceChildren();const lines=[`Lukket kl. ${time(closed)}.`,`Vi forventer, at opdateringen tager ca. 10 minutter – frem til kl. ${time(new Date(closed.getTime()+600000))}.`];
  if(Date.now()>closed.getTime()+600000)lines.push('Opdateringen tager længere tid end forventet. Vi åbner, når kontrollen er afsluttet.');
  for(const text of lines){const p=document.createElement('p');p.textContent=text;box.append(p);}};
 update();setInterval(update,30000);
}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',showMaintenanceTiming,{once:true});else showMaintenanceTiming();
</script><meta name="golfchat-publication" content="0e39ae14dba90cf6cecc19beb4f8eb27d2cb4cbc45bae9200118e6d187cba4d1"></head>
